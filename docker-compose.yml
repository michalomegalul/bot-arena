# Local development database. Start with: docker compose up -d db
# DATABASE_URL=postgresql://arena:arena@localhost:5432/arena
services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena  # dev only
      POSTGRES_DB: arena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
