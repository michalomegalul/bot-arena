# Production stack on the homelab (CT 121, /opt/bot-arena). Deployed by deploy.sh.
# Secrets come from /opt/bot-arena/.env (never committed); see deploy/README.md.
name: bot-arena

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arena
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The event log. One broker, internal to this compose network only.
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Web UI for watching the log, on the LAN at http://192.168.4.41:8080.
  # LAN/Tailscale only: never route this through the Cloudflare tunnel (no authentication).
  console:
    image: redpandadata/console:v3.12.0
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # One-off commands: docker compose run --rm arena backtest --save
  arena: &arena
    image: ghcr.io/michalomegalul/bot-arena:${ARENA_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://arena:${POSTGRES_PASSWORD}@db:5432/arena
      KAFKA_BROKERS: redpanda:9092
      ARENA_TOPIC: arena.paper
    volumes:
      - arena-data:/app/data  # data/KILL here stops all trading
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles: ["cli"]

  # --- the live paper-trading pipeline: one container per service ---
  ingest:
    <<: *arena
    command: ["ingest"]
    restart: unless-stopped
    profiles: []
  broker:
    <<: *arena
    command: ["broker"]
    restart: unless-stopped
    profiles: []
  bot-spy-hodler:
    <<: *arena
    command: ["bot", "spy-hodler"]
    restart: unless-stopped
    profiles: []
  bot-momentum:
    <<: *arena
    command: ["bot", "momentum"]
    restart: unless-stopped
    profiles: []
  bot-mean-reversion:
    <<: *arena
    command: ["bot", "mean-reversion"]
    restart: unless-stopped
    profiles: []
  bot-random-monkey:
    <<: *arena
    command: ["bot", "random-monkey"]
    restart: unless-stopped
    profiles: []
  recorder:
    <<: *arena
    command: ["recorder"]
    restart: unless-stopped
    profiles: []

  # The web UI + read-only API. LAN for now; later exposed via the Cloudflare tunnel.
  api:
    <<: *arena
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    profiles: []
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  arena-data:
  redpanda-data:
